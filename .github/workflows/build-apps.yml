name: Build apps

on:
  push:
    paths:
      - "macos-app/**"
      - "android-app/**"
      - ".github/workflows/build-apps.yml"
  pull_request:
    paths:
      - "macos-app/**"
      - "android-app/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test timing and sound code
        run: swift test --package-path macos-app

      - name: Build
        run: |
          xcodebuild -project macos-app/BreatheFree.xcodeproj -target BreatheFree -configuration Release \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

      - name: Package
        run: |
          cd macos-app/build/Release
          ditto -c -k --keepParent BreatheFree.app BreatheFree-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BreatheFree-macOS
          path: macos-app/build/Release/BreatheFree-macOS.zip

      - name: Render screens
        continue-on-error: true
        run: |
          mkdir -p screens
          swiftc -parse-as-library -o snapshots \
            macos-app/BreatheFree/Core/*.swift macos-app/BreatheFree/Audio/*.swift \
            macos-app/BreatheFree/Models/*.swift macos-app/BreatheFree/Views/*.swift \
            macos-app/Snapshots/Snapshots.swift
          ./snapshots screens

      - uses: actions/upload-artifact@v4
        with:
          name: BreatheFree-macOS-screens
          path: screens
          if-no-files-found: ignore

  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      # Certificate of the app's permanent signing key (android-app/README.md).
      RELEASE_CERT_SHA256: 70adf95509f77edc47a81b0b8305955f784d87647f81bdc73f00078d40e632ae
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      # The permanent key comes from two repository secrets. Without them the APK is
      # signed with this runner's throwaway debug key and won't install over 2.0.1 or later.
      - name: Signing key
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::The release key secrets aren't set, so this APK is signed with a throwaway key and won't install over Breathe Free 2.0.1 or later."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/breathe-free-release.p12"
          printf '%s\n' "storeFile=$RUNNER_TEMP/breathe-free-release.p12" "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=breathe-free" "keyPassword=$KEYSTORE_PASSWORD" > keystore.properties

      - name: Test and build
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Check the signing key
        working-directory: android-app
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          cert="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "APK certificate SHA-256: $cert"
          if [ -f keystore.properties ] && [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::The release key secrets are set, but the APK isn't signed with the release key."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BreatheFree-android
          path: android-app/app/build/outputs/apk/release/app-release.apk
